# HTTP 服务器：重定向到 HTTPS
server {
    listen       80;
    listen  [::]:80;
    server_name  dogdog.work www.dogdog.work www.hur.cn www.75713.cyou www.15272.cyou www.39978.cyou;

    # Certbot 验证目录（保留，续期需要）
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # 所有 HTTP 请求重定向到 HTTPS
    location / {
        return 301 https://www.dogdog.work$request_uri;
    }
}
# HTTPS 服务器：配置 SSL 证书并反向代理
server {
    listen       443 ssl http2;
    listen  [::]:443 ssl http2;
    server_name  dogdog.work www.dogdog.work;

    # SSL 证书路径（Certbot 自动生成）
    ssl_certificate /etc/letsencrypt/live/dogdog.work/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/dogdog.work/privkey.pem;

    # 推荐的 SSL 优化配置（提升安全性和性能）
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;


    gzip on;
    gzip_types text/css text/javascript application/javascript application/json image/svg+xml;
    gzip_min_length 1024;
    gzip_comp_level 5;

    location /static/ {
        proxy_pass http://dogdog-web:3000;
        proxy_set_header Host $host;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }


    # 构建产物 chunk(文件名含内容 hash,内容永不变):长缓存
    location ~* ^/chunk- {
        proxy_pass http://dogdog-web:3000;
        proxy_set_header Host $host;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # 反向代理到 myhome:3000
    location / {
        proxy_pass http://dogdog-web:3000;
	proxy_http_version 1.1;
	proxy_set_header Host $host;
	proxy_set_header X-Real-IP $remote_addr;
	proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
	proxy_set_header X-Forwarded-Proto $scheme;
	proxy_set_header Upgrade $http_upgrade;
	proxy_set_header Connection "upgrade";
	chunked_transfer_encoding on;
    }

    location ^~ /bbs/ {
        root /usr/share/nginx/html;
	try_files /a.webp =404;
        default_type image/webp;
    }
    location ^~ /webemp/ {
        root /usr/share/nginx/html;
	try_files /a.webp =404;
        default_type image/webp;
    }
    location ^~ /Soft/ {
        root /usr/share/nginx/html;
	try_files /a.webp =404;
        default_type image/webp;
    }
    
    location ~ ^/UploadFile(/|$) {
        root /usr/share/nginx/html;
	try_files /a.webp =404;
        default_type image/webp;
    }

    error_page   500 502 503 504  /50x.html;
    location = /50x.html {
        root   /usr/share/nginx/html;
    }
}
